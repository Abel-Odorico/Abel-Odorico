<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Abel Odorico — PeepConnect">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3B"/>
      <stop offset="55%" stop-color="#0A4D5C"/>
      <stop offset="100%" stop-color="#0B1F3B"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A961" stop-opacity="0"/>
      <stop offset="35%" stop-color="#C9A961"/>
      <stop offset="65%" stop-color="#C9A961"/>
      <stop offset="100%" stop-color="#C9A961" stop-opacity="0"/>
    </linearGradient>
    <style>
      .title { font-family: Manrope, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-weight: 700; fill: #FAF8F5; letter-spacing: 0.02em; }
      .sub { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-weight: 500; fill: #E8E0D8; letter-spacing: 0.08em; text-transform: uppercase; }
      .body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-weight: 400; fill: #D4C4B0; }
      .chip { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 600; fill: #FAF8F5; }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- subtle structure -->
  <rect x="0" y="0" width="8" height="360" fill="#B85C4E"/>
  <rect x="48" y="72" width="120" height="2" fill="url(#goldLine)"/>

  <text class="sub" x="48" y="64" font-size="14">PeepConnect · Belo Horizonte</text>
  <text class="title" x="48" y="128" font-size="52">Abel Odorico</text>
  <text class="body" x="48" y="172" font-size="20">Produto · IA · Automação · Dados · Experiência do Cliente</text>
  <text class="body" x="48" y="214" font-size="18">Operações complexas → produtos e sistemas que continuam funcionando.</text>

  <!-- chips -->
  <g transform="translate(48, 256)">
    <rect x="0" y="0" width="118" height="36" rx="10" fill="#0A4D5C" stroke="#C9A961" stroke-width="1"/>
    <text class="chip" x="59" y="23" font-size="13" text-anchor="middle">Produto</text>

    <rect x="130" y="0" width="78" height="36" rx="10" fill="#0A4D5C" stroke="#C9A961" stroke-width="1"/>
    <text class="chip" x="169" y="23" font-size="13" text-anchor="middle">IA</text>

    <rect x="220" y="0" width="128" height="36" rx="10" fill="#0A4D5C" stroke="#C9A961" stroke-width="1"/>
    <text class="chip" x="284" y="23" font-size="13" text-anchor="middle">Automação</text>

    <rect x="360" y="0" width="96" height="36" rx="10" fill="#0A4D5C" stroke="#C9A961" stroke-width="1"/>
    <text class="chip" x="408" y="23" font-size="13" text-anchor="middle">Dados</text>

    <rect x="468" y="0" width="64" height="36" rx="10" fill="#B85C4E"/>
    <text class="chip" x="500" y="23" font-size="13" text-anchor="middle">CX</text>
  </g>

  <!-- premium mark -->
  <circle cx="1128" cy="72" r="6" fill="#C9A961"/>
  <text x="1144" y="77" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#C9A961" letter-spacing="0.12em">ADL</text>
</svg>
